# Sobe um Kafka (1 broker, modo KRaft, sem Zookeeper) acessível em localhost:9092
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    # Guarda os dados do Kafka na memória (somem ao desligar),
    # assim o Docker não cria volumes com nomes aleatórios
    tmpfs:
      - /var/lib/kafka/data
      - /etc/kafka/secrets
      - /mnt/shared/config
